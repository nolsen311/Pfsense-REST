update_alias:
  name: Update Firewall Alias
  description: Dynamically adds or removes an IP address or hostname from a pfSense alias group.
  fields:
    entity_id:
      name: Entity ID
      description: Any active pfSense tracking entity id to route the command.
      required: true
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    alias_name:
      name: Alias Name
      description: The exact name of the alias group in pfSense (e.g., Kids_Devices).
      required: true
      example: "Kids_Devices"
    address:
      name: Target Address
      description: The exact IP address or Hostname to add or remove.
      required: true
      example: "192.168.1.50"
    action:
      name: Action
      description: Select whether to add the address to isolate it or remove it to restore access.
      required: true
      default: "add"
      selector:
        select:
          options:
            - "add"
            - "remove"

start_service:
  name: Start service
  description: Starts a service.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    service_name:
      name: Service Name
      description: The name of the service.
      required: true
      advanced: false
      example: "haproxy|dhcp|dpinger|.."
      default: ""
    service:
      name: Service Data
      description: The json-encoded data of the service.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

stop_service:
  name: Stop service
  description: Stops a service.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    service_name:
      name: Service Name
      description: The name of the service.
      required: true
      advanced: false
      example: "haproxy|dhcp|dpinger|.."
      default: ""
    service:
      name: Service Data
      description: The json-encoded data of the service.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

restart_service:
  name: Restart service
  description: Restarts a service.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    service_name:
      name: Service Name
      description: The name of the service.
      required: true
      advanced: false
      example: "haproxy|dhcp|dpinger|.."
      default: ""
    only_if_running:
      name: Only If Running
      description: Only restart if the service is currently running.
      required: false
      advanced: true
      example: "true|false|1|0"
      default: false
    service:
      name: Service Data
      description: The json-encoded data of the service.
      required: false
      advanced: true
      example: '{"vpnid": 1, "mode": "server"}'
      default: ""

reset_state_table:
  name: Reset state table
  description: Force all existing connections to close and reestablish 
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"

kill_states:
  name: Kill states
  description: Remove all state table entries for source, or from source to destination
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    source:
      name: Source
      description: Host or network
      required: true
      advanced: false
      example: "0.0.0.0/0"
      default: ""
    destination: 
      name: Destination
      description: Host or network (optional)
      required: false
      advanced: false
      example: "192.168.0.1/24"
      default: ""

system_halt:
  name: Halt system
  description: Halts the system.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"

system_reboot:
  name: Reboot system
  description: Reboots the system.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"

send_wol:
  name: Send WOL
  description: Sends wake-on-lan magic packet.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    interface:
      name: Interface Name
      description: The name of the interface.
      required: true
      advanced: false
      example: "wan|lan|opt1|opt2|..."
      default: ""
    mac:
      name: MAC Address
      description: The target mac address.
      required: true
      advanced: false
      example: ""
      default: ""

set_default_gateway:
  name: Set Default Gateway
  description: Set the default gateway for ipv4 and ipv6.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    gateway:
      name: Gateway Name
      description: The name of the gateway.
      required: true
      advanced: false
      example: "GW_WAN, '-' is None and '' is Automatice"
      default: ""
    ip_version:
      name: IP Version
      description: The IP version to update.
      required: true
      advanced: false
      example: "4|6"
      default: "4"

exec_command:
  name: Exec Command
  description: Execute a command.
  fields:
    entity_id:
      name: Entity ID
      description: pfSense entity id
      example: "binary_sensor.pfsense_localdomain_pending_notices_present"
    command:
      name: Command
      description: The command to run.
      required: true
      advanced: false
      example: "ping -c 1 yahoo.com"
      default: ""
ping:
  name: Ping
  description: Ping a host from the firewall and return the loss and round-trip times.
  fields:
    config_entry_id: &firewall
      name: Firewall
      description: Which pfSense firewall to run it on. Only needed with more than one.
      selector:
        config_entry:
          integration: pfsense
    host: &host
      name: Host
      description: Host name or IP address.
      required: true
      example: "1.1.1.1"
      selector:
        text:
    count:
      name: Count
      description: Packets to send (1-20).
      default: 3
      selector:
        number:
          min: 1
          max: 20
    source: &source
      name: Source
      description: Interface (e.g. wan, lan) or local address to send from. Default is any.
      selector:
        text:
    ipv6: &ipv6
      name: IPv6
      description: Use IPv6 when the host is a name.
      default: false
      selector:
        boolean:

traceroute:
  name: Traceroute
  description: Trace the route to a host from the firewall (UDP) and return each hop.
  fields:
    config_entry_id: *firewall
    host: *host
    max_hops:
      name: Max hops
      description: Stop after this many hops (1-30). A hop that doesn't answer takes about 15 seconds.
      default: 15
      selector:
        number:
          min: 1
          max: 30
    source: *source
    ipv6: *ipv6

test_port:
  name: Test port
  description: Check whether the firewall can open a TCP connection to a host and port.
  fields:
    config_entry_id: *firewall
    host: *host
    port:
      name: Port
      description: TCP port (1-65535).
      required: true
      example: 443
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    ipv6: *ipv6

dns_lookup:
  name: DNS lookup
  description: Resolve a host name with the firewall's DNS servers and return the records and each server's response time.
  fields:
    config_entry_id: *firewall
    host: *host
