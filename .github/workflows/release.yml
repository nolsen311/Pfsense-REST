name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect integration
        id: integration
        run: |
          INTEGRATION=$(find custom_components -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)

          echo "integration=$INTEGRATION" >> $GITHUB_OUTPUT

          echo "Detected integration: $INTEGRATION"

      - name: Verify manifest version matches the tag
        run: |
          INTEGRATION=${{ steps.integration.outputs.integration }}
          MANIFEST="custom_components/$INTEGRATION/manifest.json"

          TAG_VERSION=${GITHUB_REF_NAME#v}
          MANIFEST_VERSION=$(jq -r '.version' "$MANIFEST")

          echo "tag: $GITHUB_REF_NAME  ->  $TAG_VERSION"
          echo "manifest: $MANIFEST_VERSION"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match $MANIFEST version $MANIFEST_VERSION. Bump manifest.json in a commit and tag that commit."
            exit 1
          fi

      - name: Create ZIP
        run: |
          INTEGRATION=${{ steps.integration.outputs.integration }}

          cd custom_components/$INTEGRATION

          zip -r "$INTEGRATION.zip" ./*

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: custom_components/${{ steps.integration.outputs.integration }}/${{ steps.integration.outputs.integration }}.zip
